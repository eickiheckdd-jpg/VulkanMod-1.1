# Builds the project on every push and pull request, and publishes the built
# jars as a GitHub Release (not as a workflow artifact).
# You can also run it by hand: Actions tab -> build -> "Run workflow".

name: build
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          21,    # Current Java LTS
        ]
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      # Pull requests from forks have no write access, so only release on
      # pushes and manual runs.
      - name: publish release
        if: ${{ matrix.java == '21' && github.event_name != 'pull_request' }} # Only release builds from latest java
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: build/libs/*.jar